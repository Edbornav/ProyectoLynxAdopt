<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LynxAdopt – Perfil del Adoptante</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .test-container {
      width: 640px;
      max-width: 95vw;
      animation: fadeInUp 0.5s ease both;
    }

    .test-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .test-header h1 {
      font-family: 'Fredoka One', cursive;
      font-size: 2.2rem;
      color: var(--white);
    }
    .test-header p {
      color: var(--beige-light);
      font-weight: 600;
      margin-top: 6px;
    }

    .progress-bar-wrap {
      background: rgba(255,255,255,0.25);
      border-radius: 999px;
      height: 8px;
      margin-bottom: 28px;
      overflow: hidden;
    }
    .progress-bar-fill {
      background: var(--white);
      border-radius: 999px;
      height: 100%;
      transition: width 0.4s ease;
      width: 33%;
    }

    .question-card {
      background: var(--beige-card);
      border-radius: 24px;
      padding: 32px 36px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-lg);
    }

    .question-num {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .question-text {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .question-desc {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 16px;
    }

    .option-textarea {
      width: 100%;
      padding: 14px 20px;
      border-radius: var(--radius);
      border: none;
      background: var(--orange);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      resize: vertical;
      min-height: 100px;
    }
    .option-textarea::placeholder { color: rgba(255,255,255,0.65); }
    .option-textarea:focus { background: var(--orange-dark); }

    .nav-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 16px;
    }

    .btn-nav {
      flex: 1;
      max-width: 280px;
      padding: 14px;
      border-radius: var(--radius-pill);
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-next { background: var(--brown); color: white; }
    .btn-next:hover { background: var(--brown-dark); transform: translateY(-2px); box-shadow: var(--shadow); }
  </style>
</head>
<body>

  <div class="test-container">

    <div class="test-header fade-in">
      <div style="font-family:'Fredoka One',cursive;font-size:1.3rem;color:var(--beige-light);margin-bottom:6px;">🐾 LynxAdopt</div>
      <h1>Perfil del Adoptante</h1>
      <p>Cuéntanos sobre ti para encontrar al compañero ideal</p>
    </div>

    <div class="progress-bar-wrap fade-in-delay-1">
      <div class="progress-bar-fill" id="progressBar" style="width:33%"></div>
    </div>

    <div class="question-card fade-in-delay-1" id="questionCard"></div>

    <div class="nav-buttons fade-in-delay-2">
      <button class="btn-nav btn-next" id="btnNext" onclick="siguientePaso()">Siguiente →</button>
    </div>

  </div>

  <script>
    let paso = 0;
    const perfil = {
      descripcionCasa: '',
      descripcionMascotas: '',
      descripcionExperienciaConMascotas: ''
    };

    const pasos = [
      {
        titulo: '¿Cómo es tu casa?',
        desc: 'Descríbenos el espacio donde viviría tu mascota',
        placeholder: 'Ej. Casa con jardín amplio, departamento pequeño, etc...',
        key: 'descripcionCasa'
      },
      {
        titulo: '¿Tienes otras mascotas?',
        desc: 'Cuéntanos si conviviría con otros animales',
        placeholder: 'Ej. Tengo un perro, no tengo mascotas, etc...',
        key: 'descripcionMascotas'
      },
      {
        titulo: '¿Cuál es tu experiencia con mascotas?',
        desc: 'Describe tu experiencia previa cuidando animales',
        placeholder: 'Ej. He tenido mascotas toda mi vida, es mi primera vez, etc...',
        key: 'descripcionExperienciaConMascotas'
      }
    ];

    function renderPaso() {
      const s = pasos[paso];
      const pct = Math.round(((paso + 1) / pasos.length) * 100);
      document.getElementById('progressBar').style.width = pct + '%';

      const card = document.getElementById('questionCard');
      card.innerHTML = `
        <div class="question-num">Paso ${paso + 1} de ${pasos.length}</div>
        <div class="question-text">${s.titulo}</div>
        <div class="question-desc">${s.desc}</div>
        <textarea class="option-textarea" placeholder="${s.placeholder}" id="inputPerfil">${perfil[s.key] || ''}</textarea>
      `;

      document.getElementById('btnNext').textContent = paso < pasos.length - 1
        ? 'Siguiente →'
        : 'Guardar perfil ✓';
    }

    function siguientePaso() {
      const input = document.getElementById('inputPerfil');
      if (input) perfil[pasos[paso].key] = input.value;

      if (paso < pasos.length - 1) {
        paso++;
        renderPaso();
      } else {
      // TODO: POST /api/perfil-adoptante
      //   { descripcionCasa, descripcionMascotas, descripcionExperienciaConMascotas }
      //   Inserta en tabla PerfilAdoptante
      //   Redirigir a: 03_catalogo_adoptante.html
      }
    }

    renderPaso();
  </script>
</body>
</html>
