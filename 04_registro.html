<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LynxAdopt – Registro</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .register-box {
      background: var(--beige-card);
      border-radius: 28px;
      padding: 48px 52px;
      width: 600px;
      max-width: 95vw;
      box-shadow: var(--shadow-lg);
      animation: fadeInUp 0.5s ease both;
    }

    .reg-logo {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--orange);
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 6px;
    }
    .reg-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2rem;
      color: var(--text-dark);
      margin-bottom: 8px;
    }
    .reg-subtitle {
      font-size: 0.9rem;
      color: var(--text-mid);
      font-weight: 600;
      margin-bottom: 28px;
    }

    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .role-option {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius);
      border: 3px solid transparent;
      background: var(--beige);
      text-align: center;
      cursor: pointer;
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--text-mid);
      transition: all 0.2s;
    }
    .role-option.selected {
      border-color: var(--orange);
      background: var(--orange);
      color: white;
    }
    .role-option .role-emoji { font-size: 1.6rem; display: block; margin-bottom: 4px; }

    .btn-register {
      width: 100%;
      padding: 14px;
      background: var(--brown);
      color: white;
      font-family: 'Fredoka One', cursive;
      font-size: 1.2rem;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-register:hover { background: var(--brown-dark); transform: translateY(-2px); box-shadow: var(--shadow); }

    .terms {
      font-size: 0.82rem;
      color: var(--text-mid);
      text-align: center;
      margin-top: 12px;
    }
    .terms a { color: var(--orange-dark); font-weight: 700; }

    .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-mid);
    }
    .login-link a { color: var(--orange-dark); font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>

  <div class="register-box">
    <div class="reg-logo">🐾 LynxAdopt</div>
    <h2 class="reg-title">Crear cuenta</h2>
    <p class="reg-subtitle">Únete y encuentra a tu compañero perfecto</p>

    <div class="role-selector">
      <div class="role-option selected" onclick="selectRole(this, 'adoptante')">
        <span class="role-emoji">👤</span>Adoptante
      </div>
      <div class="role-option" onclick="selectRole(this, 'administrador')">
        <span class="role-emoji">🏠</span>Administrador
      </div>
    </div>

    <div class="form-grid">
      <div class="fg">
        <label>Nombre(s)</label>
        <input type="text" id="regNombre" placeholder="Tu nombre..."/>
      </div>
      <div class="fg">
        <label>Apellido paterno</label>
        <input type="text" id="regApellidoPaterno" placeholder="Apellido paterno"/>
      </div>
      <div class="fg">
        <label>Apellido materno</label>
        <input type="text" id="regApellidoMaterno" placeholder="Apellido materno"/>
      </div>
      <div class="fg">
        <label>Fecha de nacimiento</label>
        <input type="date" id="regFechaNacimiento"/>
      </div>
      <div class="fg full-col">
        <label>Correo electrónico</label>
        <input type="email" id="regEmail" placeholder="correo@ejemplo.com"/>
      </div>
      <div class="fg">
        <label>Contraseña</label>
        <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres"/>
      </div>
      <div class="fg">
        <label>Confirmar contraseña</label>
        <input type="password" id="regConfirmar" placeholder="Repetir contraseña"/>
      </div>
      <div class="fg full-col">
        <label>Teléfono de contacto</label>
        <input type="tel" id="regTelefono" placeholder="10 dígitos"/>
      </div>
    </div>

    <button class="btn-register" onclick="register()">Crear cuenta</button>
    <p class="terms">
      Al registrarte aceptas nuestros <a href="#">Términos de uso</a> y <a href="#">Política de privacidad</a>
    </p>
    <p class="login-link">
      ¿Ya tienes cuenta? <a href="02_inicio_sesion.html">Inicia sesión</a>
    </p>
  </div>

  <script>
    let rolSeleccionado = 'adoptante';

    function selectRole(el, rol) {
      document.querySelectorAll('.role-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      rolSeleccionado = rol;
    }

    function register() {
      const data = {
        correo: document.getElementById('regEmail').value,
        password: document.getElementById('regPassword').value,
        tipoUsuario: rolSeleccionado === 'adoptante' ? 'Adoptante' : 'Administrador',
        nombre: document.getElementById('regNombre').value,
        apellidoPaterno: document.getElementById('regApellidoPaterno').value,
        apellidoMaterno: document.getElementById('regApellidoMaterno').value,
        telefono: document.getElementById('regTelefono').value,
        fechaNacimiento: document.getElementById('regFechaNacimiento').value
      };
      // TODO: POST /api/auth/registro
      //   Inserta en Usuarios (correo, tipoUsuario, estatus='Activo', fechaRegistro=GETDATE())
      //   + Adoptante o Administrador según tipoUsuario
      //   Redirigir: adoptante -> 04b_test_perfil.html
      //              administrador -> 06_inicio_refugio.html
    }
  </script>
</body>
</html>
