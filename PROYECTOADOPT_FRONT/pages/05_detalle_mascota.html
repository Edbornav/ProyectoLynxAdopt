  <div class="detail-card">
    <div class="detail-img-col" id="detailImgCol">
      🐾
      <div class="refugio-badge" id="detailRefugioBadge">🏠 --</div>
    </div>
    <div class="detail-info-col">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">

    <p style="color:var(--text-mid);font-weight:600;margin-bottom:20px;">¿Estás seguro de que deseas adoptar a esta mascota?</p>

  </div>
