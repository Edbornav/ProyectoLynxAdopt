<style>
  .page-wrap { padding: 20px 32px 40px; max-width: 1100px; margin: 0 auto; }
  .back-row { margin-bottom: 16px; }

  .ref-header-card {
    background: var(--beige-card);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    animation: fadeInUp 0.4s ease both;
    margin-bottom: 24px;
  }
  .ref-header-top {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 36px 40px 24px;
  }
  .ref-logo-big {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--orange-light), var(--brown));
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem;
    flex-shrink: 0;
  }
  .ref-header-info h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2rem;
    color: var(--text-dark);
    margin: 0 0 4px;
  }
  .ref-header-info .ref-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-mid);
  }
  .ref-meta span { display: flex; align-items: center; gap: 4px; }

  .ref-stats-row {
    display: flex;
    border-top: 2px solid var(--beige);
    background: var(--white);
  }
  .ref-stat {
    flex: 1;
    text-align: center;
    padding: 16px;
  }
  .ref-stat + .ref-stat { border-left: 1px solid var(--beige); }
  .ref-stat .num { font-family: 'Fredoka One', cursive; font-size: 1.8rem; color: var(--orange); }
  .ref-stat .lbl { font-size: 0.78rem; font-weight: 800; color: var(--text-mid); }

  .ref-body-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 28px;
  }
  .ref-section-card {
    background: var(--beige-card);

    padding: 24px 28px;

    font-family: 'Fredoka One', cursive;
    font-size: 1.1rem;
    color: var(--text-dark);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ref-section-card.full { grid-column: 1 / -1; }

  .desc-text {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.7;
  }

  .contact-list { display: flex; flex-direction: column; gap: 10px; }
  .contact-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--text-dark);
  }
  .contact-item .ci-icon { font-size: 1.1rem; width: 24px; text-align: center; }
  .contact-item .ci-lbl { font-size: 0.75rem; font-weight: 800; color: var(--text-mid); text-transform: uppercase; min-width: 70px; }

  .ref-photo-placeholder {
    border-radius: var(--radius);
    background: var(--beige);
    min-height: 200px;
    display: flex; align-items: center; justify-content: center;
    font-size: 4rem;
    overflow: hidden;
  }

  .pets-grid-refugio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }

  .ref-footer-action {
    text-align: center;
    padding: 20px 0 8px;
  }
</style>
