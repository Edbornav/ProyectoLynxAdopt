<div class="register-box">
  <div class="reg-logo">🐾 LynxAdopt</div>
  <h2 class="reg-title">Completa tu perfil</h2>
  <p class="reg-subtitle">Cuéntanos un poco sobre ti</p>

  <div class="form-grid">
    <div class="fg full-col" style="text-align:center;margin-bottom:8px;">
      <label>Foto de perfil (opcional)</label>
      <div onclick="document.getElementById('regFoto').click()" style="width:100px;height:100px;border-radius:50%;border:3px dashed var(--beige-dark);margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;overflow:hidden;background:var(--beige);" id="regFotoPreview">📷</div>
      <input type="file" id="regFoto" accept="image/*" style="display:none" onchange="previewRegFoto(event)"/>
    </div>
    <div class="fg">
      <label>Nombre(s)</label>
      <input type="text" id="regNombre" placeholder="Tu nombre..."/>
    </div>
    <div class="fg">
      <label>Apellido paterno</label>
      <input type="text" id="regApellidoPaterno" placeholder="Apellido paterno"/>
    </div>
    <div class="fg">
      <label>Apellido materno</label>
      <input type="text" id="regApellidoMaterno" placeholder="Apellido materno"/>
    </div>
    <div class="fg">
      <label>Fecha de nacimiento</label>
      <input type="date" id="regFechaNacimiento"/>
    </div>
    <div class="fg full-col">
      <label>Teléfono de contacto</label>
      <input type="tel" id="regTelefono" placeholder="10 dígitos"/>
    </div>
  </div>

  <button class="btn-register" onclick="register()">Guardar perfil</button>
  <p class="login-link">
    ¿Ya tienes cuenta? <a href="#02_inicio_sesion">Inicia sesión</a>
  </p>
</div>
