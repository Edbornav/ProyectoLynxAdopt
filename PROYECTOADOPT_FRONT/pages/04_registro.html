<div class="register-box">
  <div class="reg-logo">🐾 LynxAdopt</div>
  <h2 class="reg-title">Crear cuenta</h2>
  <p class="reg-subtitle">Únete y encuentra a tu compañero perfecto</p>

  <div class="role-selector">
    <div class="role-option selected" onclick="selectRole(this, 'Adoptante')">
      <span class="role-emoji">👤</span>Adoptante
    </div>
    <div class="role-option" onclick="selectRole(this, 'Administrador')">
      <span class="role-emoji">🏠</span>Administrador
    </div>
  </div>

  <div class="form-grid">
    <div class="fg">
      <label>Nombre(s)</label>
      <input type="text" id="regNombre" placeholder="Tu nombre..."/>
    </div>
    <div class="fg">
      <label>Apellido paterno</label>
      <input type="text" id="regApellidoPaterno" placeholder="Apellido paterno"/>
    </div>
    <div class="fg">
      <label>Apellido materno</label>
      <input type="text" id="regApellidoMaterno" placeholder="Apellido materno"/>
    </div>
    <div class="fg" id="campoFechaNacimiento">
      <label>Fecha de nacimiento</label>
      <input type="date" id="regFechaNacimiento"/>
    </div>
    <div class="fg full-col">
      <label>Correo electrónico</label>
      <input type="email" id="regEmail" placeholder="correo@ejemplo.com"/>
    </div>
    <div class="fg">
      <label>Contraseña</label>
      <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres"/>
    </div>
    <div class="fg">
      <label>Confirmar contraseña</label>
      <input type="password" id="regConfirmar" placeholder="Repetir contraseña"/>
    </div>
    <div class="fg full-col">
      <label>Teléfono de contacto</label>
      <input type="tel" id="regTelefono" placeholder="10 dígitos"/>
    </div>
  </div>

  <button class="btn-register" onclick="register()">Crear cuenta</button>
  <p class="terms">
    Al registrarte aceptas nuestros <a href="#">Términos de uso</a> y <a href="#">Política de privacidad</a>
  </p>
  <p class="login-link">
    ¿Ya tienes cuenta? <a href="#02_inicio_sesion">Inicia sesión</a>
  </p>
</div>
