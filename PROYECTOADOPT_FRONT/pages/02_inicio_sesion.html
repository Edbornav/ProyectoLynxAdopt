<div class="paw-bg-left">🐾</div>

<div class="login-wrapper">
  <div class="login-form-panel">
    <div class="login-logo">🐾 LynxAdopt</div>
    <h2 class="login-title">Inicio de sesión</h2>

    <div class="login-input-group">
      <label>Correo electrónico:</label>
      <input type="email" id="loginEmail" placeholder="correo@ejemplo.com"/>
    </div>
    <div class="login-input-group">
      <label>Contraseña:</label>
      <input type="password" id="loginPassword" placeholder="••••••••"/>
    </div>

    <button class="btn-acceder" onclick="login()">Acceder</button>

    <p class="register-link">
      ¿No tienes cuenta? <a href="#04_registro">Regístrate aquí</a>
    </p>
  </div>
  <div class="login-image-panel">
    <span class="cat-emoji">🐱</span>
  </div>
</div>
