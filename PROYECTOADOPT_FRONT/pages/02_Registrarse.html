<div class="paw-bg-left">🐾</div>

<div class="login-wrapper">
  <div class="login-form-panel">
    <div class="login-logo">🐾 LynxAdopt</div>
    <h2 class="login-title">Crear cuenta</h2>

    <div class="login-input-group">
      <label>Correo electrónico:</label>
      <input type="email" id="regEmail" placeholder="correo@ejemplo.com"/>
    </div>
    <div class="login-input-group">
      <label>Contraseña:</label>
      <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres"/>
    </div>
    <div class="login-input-group">
      <label>Confirmar contraseña:</label>
      <input type="password" id="regConfirmar" placeholder="Repetir contraseña"/>
    </div>

    <button class="btn-acceder" onclick="registrarse()">Crear cuenta</button>

    <p class="register-link">
      ¿Ya tienes cuenta? <a href="#02_inicio_sesion">Inicia sesión</a>
    </p>
  </div>
  <div class="login-image-panel">
    <span class="cat-emoji">🐱</span>
  </div>
</div>
