<style>
  body { min-height: 100vh; }
  .page-wrap { padding: 28px 40px; max-width: 1200px; margin: 0 auto; }
  .refugio-layout { display: flex; gap: 28px; animation: fadeInUp 0.4s ease both; }
  .refugio-info-card { width: 280px; flex-shrink: 0; }
  .refugio-main-card {
    background: var(--white);
    border-radius: 24px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .refugio-logo {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--orange-light), var(--brown));
    display: flex; align-items: center; justify-content: center;
    font-size: 2.8rem;
    margin: 0 auto 14px;
  }
  .refugio-big-name { font-family: 'Fredoka One', cursive; font-size: 1.4rem; color: var(--text-dark); margin-bottom: 10px; }
  .refugio-stats { display: flex; margin-top: 16px; border-top: 1px solid var(--beige); padding-top: 16px; }
  .r-stat { flex: 1; text-align: center; }
  .r-stat .num { font-family: 'Fredoka One', cursive; font-size: 1.6rem; color: var(--orange); }
  .r-stat .lbl { font-size: 0.75rem; font-weight: 800; color: var(--text-mid); }
  .r-stat + .r-stat { border-left: 1px solid var(--beige); }
  .refugio-nav { display: flex; flex-direction: column; gap: 10px; }
  .refugio-content { flex: 1; min-width: 0; }
  .about-section {
    background: var(--beige-card);
    border-radius: 20px;
    padding: 24px 28px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .about-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; }
  .about-description { font-size: 0.88rem; font-weight: 600; color: var(--text-dark); line-height: 1.7; }
  .about-photo-col {
    border-radius: var(--radius);
    background: var(--beige);
    min-height: 200px;
    display: flex; align-items: center; justify-content: center;
    font-size: 5rem;
    overflow: hidden;
    position: relative;
  }
  .mascotas-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .pets-grid-refugio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
</style>
